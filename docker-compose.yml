# Runs the shop from published images on a 1 vCPU / 2 GB VM. Only this file and .env are needed on the server.
name: thepackhouse

x-service: &service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *service
    image: ndtrungggai/thepackhouse:web-${TAG:-latest}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      - site:/srv/site:ro
      - uploads:/srv/uploads:ro
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 64m
    # Keeps the storefront responsive when an image upload or login is using the CPU.
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/config.js"]
      interval: 60s
      timeout: 5s
      retries: 3

  api:
    <<: *service
    image: ndtrungggai/thepackhouse:api-${TAG:-latest}
    environment:
      SITE_URL: ${SITE_URL:-https://thepackhouse.vn}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NOTIFICATION_WEBHOOK_URL: http://notifier:4000/webhook
    volumes:
      - api-data:/data
      - site:/site
      - uploads:/uploads
    mem_limit: 256m
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 5s
      retries: 3

  notifier:
    <<: *service
    image: ndtrungggai/thepackhouse:notifier-${TAG:-latest}
    mem_limit: 64m
    cpu_shares: 256

volumes:
  # Products, orders and admin accounts.
  api-data:
  # Catalogue pages published by the api, served by nginx.
  site:
  # Product images uploaded through the admin page, served by nginx.
  uploads:
