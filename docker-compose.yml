name: thepackhouse

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://thepackhouse.vn}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"

  cms:
    build: ./cms
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
      NOTIFICATION_WEBHOOK_URL: http://notifier:4000/webhook
    # Loopback only: the public reaches the CMS through nginx in the web service.
    ports:
      - "127.0.0.1:1337:1337"
    volumes:
      - cms-data:/app/.tmp
      - cms-uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  notifier:
    build: ./notification-middleware
    restart: unless-stopped
    environment:
      PORT: 4000
      STRAPI_PROXY_TARGET: http://cms:1337

volumes:
  cms-data:
  cms-uploads:
