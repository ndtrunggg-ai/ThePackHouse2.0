# Visitors arrive through Cloudflare: take their address from its header, but only from its own ranges.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Password hashing is the most expensive request on one vCPU, so it gets the tightest limit.
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=track:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=orders:1m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  # Written by /docker-entrypoint.d/40-tls.sh when a certificate is mounted.
  include /etc/nginx/tls*.inc;

  # GitHub Pages sent www to the bare domain; old links keep working the same way.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  root /srv;

  client_max_body_size 1m;

  # Catalogue and build output ship with .gz files; on-the-fly compression only covers the rest.
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 4;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  # A customer ordering during an API restart should see an error quickly, not wait a minute.
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;

  # Resolve at request time so the storefront still starts while the API is down.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://api:3000;

  location = /api/admin/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass $api;
  }

  location = /api/orders/track {
    limit_req zone=track burst=10 nodelay;
    proxy_pass $api;
  }

  location = /api/orders {
    limit_req zone=orders burst=10 nodelay;
    proxy_pass $api;
  }

  location ~ ^/api/admin/products/\d+/images$ {
    client_max_body_size 15m;
    proxy_pass $api;
  }

  location /api/ {
    proxy_pass $api;
  }

  # Upload names are random and never reused, so they can be cached for a long time.
  location /uploads/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  location /assets/ {
    root /srv/static;
    add_header Cache-Control "public, max-age=2592000";
  }

  location = / {
    add_header Cache-Control "no-cache";
    try_files /site/index.html /static/index.html;
  }

  # The storefront's fallback page; a target of its own so try_files below cannot loop.
  location = /static/index.html {
    add_header Cache-Control "no-cache";
  }

  # Published catalogue files first, then the pages built into the image.
  location / {
    add_header Cache-Control "no-cache";
    try_files /site$uri /site$uri.html /static$uri /static$uri.html /static/index.html;
  }
}
