server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;
  gzip_min_length 1024;

  # Resolve at request time so the storefront still starts while the CMS is down.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $cms http://cms:1337;

  # The first admin can only be created through an SSH tunnel to 127.0.0.1:1337.
  location = /admin/register-admin {
    return 403;
  }

  location ~ ^/(api|uploads|admin|content-manager|content-type-builder|upload|i18n|users-permissions|email)(/|$) {
    proxy_pass $cms;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /config.js {
    add_header Cache-Control "no-cache";
  }

  location = /products.json {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 7d;
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}
